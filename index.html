<title>こえボード</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --sub: #8A867D;
    --line: #E5E3DC;
    --accent: #CC785C;
    --accent-deep: #B4674E;
    --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, sans-serif;
    --serif: Georgia, "Hiragino Mincho ProN", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1B18; --surface: #242320; --ink: #ECE9E2; --sub: #9B978D;
      --line: #3A3833; --accent: #D08A70; --accent-deep: #DB9A82;
    }
  }
  :root[data-theme="light"] {
    --bg: #FAFAF7; --surface: #FFFFFF; --ink: #1A1A1A; --sub: #8A867D;
    --line: #E5E3DC; --accent: #CC785C; --accent-deep: #B4674E;
  }
  :root[data-theme="dark"] {
    --bg: #1C1B18; --surface: #242320; --ink: #ECE9E2; --sub: #9B978D;
    --line: #3A3833; --accent: #D08A70; --accent-deep: #DB9A82;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100dvh; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

  .shell { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 2px 12px; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--serif); font-size: 20px; letter-spacing: 0.06em; }
  .top-ops { display: flex; gap: 8px; }
  .top-ops button {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--sans); font-size: 14px; color: var(--sub);
    padding: 8px 14px; cursor: pointer;
  }
  .top-ops button.on { border-color: var(--accent); color: var(--accent-deep); }

  /* ---- 入力エリア ---- */
  .talk-area { padding: 18px 0 6px; }
  .talk-input {
    width: 100%; font-size: 20px; font-family: var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; line-height: 1.6; resize: none;
  }
  .talk-input:focus { outline: none; border-color: var(--accent); }
  .talk-btns { display: flex; gap: 10px; margin-top: 10px; }
  .talk-btns .speak-btn {
    flex: 1; padding: 18px 0; font-size: 19px; font-weight: 600; font-family: var(--sans);
    background: var(--accent); color: #FFFFFF; border: none; border-radius: 8px; cursor: pointer;
  }
  .talk-btns .show-btn {
    width: 96px; font-size: 15px; font-family: var(--sans);
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }
  .talk-btns button:active { opacity: 0.75; }
  .save-line { margin-top: 8px; min-height: 24px; }
  .save-line button {
    background: none; border: none; font-size: 13px; color: var(--sub); font-family: var(--sans);
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 2px;
  }

  /* ---- 最近 ---- */
  .recent-row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; -webkit-overflow-scrolling: touch; }
  .recent-row::-webkit-scrollbar { display: none; }
  .recent-row button {
    flex-shrink: 0; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    font-family: var(--sans); font-size: 15px; color: var(--sub); padding: 8px 16px; cursor: pointer;
  }

  /* ---- カテゴリ ---- */
  .cat-row { display: flex; gap: 6px; overflow-x: auto; padding: 16px 0 4px; -webkit-overflow-scrolling: touch; }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-row button {
    flex-shrink: 0; background: none; border: none; border-bottom: 2px solid transparent;
    font-family: var(--sans); font-size: 16px; color: var(--sub); padding: 8px 12px; cursor: pointer;
  }
  .cat-row button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  /* ---- フレーズ ---- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 0; }
  .grid button.phrase {
    position: relative; min-height: 72px; padding: 14px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--sans); font-size: 19px; line-height: 1.5; color: var(--ink);
    cursor: pointer; overflow-wrap: anywhere; text-align: center;
  }
  .grid button.phrase:active { border-color: var(--accent); }
  .grid button.phrase.speaking { border-color: var(--accent); color: var(--accent-deep); }
  .grid button.phrase .del {
    display: none; position: absolute; top: -9px; right: -7px;
    width: 26px; height: 26px; line-height: 24px; border-radius: 50%;
    background: var(--ink); color: var(--bg); font-size: 15px; text-align: center;
  }
  .editing .grid button.phrase .del { display: block; }
  .editing .grid button.phrase { border-style: dashed; }
  .grid button.add-tile {
    min-height: 72px; background: none; border: 1px dashed var(--line); border-radius: 8px;
    font-family: var(--sans); font-size: 16px; color: var(--sub); cursor: pointer;
  }
  .grid-empty { grid-column: 1 / -1; text-align: center; color: var(--sub); font-size: 14px; padding: 24px 0; }

  /* ---- 大きく表示 ---- */
  #bigShow {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: var(--bg); color: var(--ink);
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 20px; cursor: pointer;
  }
  #bigShow.show { display: flex; }
  #bigShow .big-text { font-size: 56px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  #bigShow .big-text.long { font-size: 36px; }
  #bigShow .close-hint { position: fixed; bottom: 24px; left: 0; right: 0; font-size: 13px; color: var(--sub); }

  /* ---- シート ---- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(20, 18, 14, 0.4);
    z-index: 20; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 560px;
    border-radius: 10px 10px 0 0; padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
  }
  .sheet h3 { font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: var(--sub); margin-bottom: 18px; }
  label.field { display: block; margin-bottom: 18px; }
  label.field span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .sheet input[type="text"], .sheet select {
    width: 100%; font-size: 17px; font-family: var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 13px 14px;
  }
  .sheet input[type="range"] { width: 100%; accent-color: var(--accent); }
  .preset-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .preset-row button {
    flex: 1; padding: 13px 0; font-size: 16px; font-family: var(--sans);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); cursor: pointer;
  }
  .preset-row button.on { border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }
  .range-val { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .ops-row { display: flex; gap: 10px; margin-top: 6px; }
  .ops-row button {
    flex: 1; padding: 15px 0; font-size: 16px; font-family: var(--sans); border-radius: 8px; cursor: pointer;
  }
  .ops-row .primary { background: var(--accent); border: none; color: #FFFFFF; font-weight: 600; }
  .ops-row .quiet { background: none; border: 1px solid var(--line); color: var(--sub); }
  .sheet .note { font-size: 13px; color: var(--sub); line-height: 1.9; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(28px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); font-size: 14px;
    padding: 11px 22px; border-radius: 6px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s; z-index: 50; max-width: 90%; text-align: center;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
</style>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand">こえボード</div>
    <div class="top-ops">
      <button id="btnEdit">編集</button>
      <button id="btnSettings">設定</button>
    </div>
  </header>

  <div class="talk-area">
    <textarea class="talk-input" id="talkInput" rows="2" placeholder="ここに入力して「話す」を押す" aria-label="話したい言葉を入力"></textarea>
    <div class="talk-btns">
      <button class="speak-btn" id="btnSpeak">話す</button>
      <button class="show-btn" id="btnShow">大きく<br>見せる</button>
    </div>
    <div class="save-line" id="saveLine"></div>
  </div>

  <div class="recent-row" id="recentRow"></div>

  <div class="cat-row" id="catRow"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="bigShow" role="button" aria-label="閉じる">
  <div class="big-text" id="bigText"></div>
  <div class="close-hint">画面をタップすると閉じます</div>
</div>

<!-- フレーズ追加 -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3>ことばを登録</h3>
    <label class="field"><span>ことば</span><input type="text" id="addText" autocomplete="off"></label>
    <label class="field"><span>グループ</span><select id="addCat"></select></label>
    <div class="ops-row">
      <button class="quiet" id="addCancel">閉じる</button>
      <button class="primary" id="addSave">登録する</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="overlay" id="setOverlay">
  <div class="sheet">
    <h3>声の設定</h3>
    <div class="field"><span style="display:block;font-size:13px;color:var(--sub);margin-bottom:6px">話す速さ</span>
      <div class="preset-row" id="ratePresets">
        <button data-rate="0.75">ゆっくり</button>
        <button data-rate="1.0">ふつう</button>
        <button data-rate="1.3">はやい</button>
      </div>
    </div>
    <label class="field"><span>速さの細かい調整　<span class="range-val" id="rateVal"></span></span>
      <input type="range" id="rateRange" min="0.5" max="1.8" step="0.05"></label>
    <label class="field"><span>声の高さ　<span class="range-val" id="pitchVal"></span></span>
      <input type="range" id="pitchRange" min="0.7" max="1.5" step="0.05"></label>
    <label class="field"><span>声の種類</span><select id="voiceSelect"></select></label>
    <div class="ops-row">
      <button class="quiet" id="setClose">閉じる</button>
      <button class="primary" id="setTest">この声でためす</button>
    </div>
    <p class="note">
      音が出ないときは、本体横のスイッチ（マナーモード）を解除して、音量を上げてください。
      このアプリはインターネットがない場所でも、いちど開いたあとなら読み上げできます。
      Safariの共有メニューから「ホーム画面に追加」すると、ふつうのアプリのように使えます。
    </p>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var KEY = 'koeboard-v1';
  var CATS = ['よく使う', '返事', 'お願い', '体調', '気持ち'];

  var PRESETS = [
    ['よく使う', 'ありがとう'], ['よく使う', 'おはよう'], ['よく使う', 'おやすみなさい'],
    ['よく使う', 'ごめんね'], ['よく使う', 'おつかれさま'], ['よく使う', 'また連絡するね'],
    ['返事', 'はい'], ['返事', 'いいえ'], ['返事', 'わかった'], ['返事', 'いいよ'],
    ['返事', 'ちょっと待って'], ['返事', 'だいじょうぶ'], ['返事', 'あとでね'],
    ['お願い', 'ゆっくり話して'], ['お願い', 'もう一回言って'], ['お願い', '手伝ってほしい'],
    ['お願い', '水がほしい'], ['お願い', '紙とペンを貸して'], ['お願い', 'ここに書いて見せて'],
    ['体調', '痛い'], ['体調', '苦しい'], ['体調', '気分が悪い'], ['体調', '眠い'],
    ['体調', 'おなかがすいた'], ['体調', 'トイレに行きたい'], ['体調', '今日は調子がいい'],
    ['気持ち', 'うれしい'], ['気持ち', 'たのしみ'], ['気持ち', 'びっくりした'],
    ['気持ち', '心配しないで'], ['気持ち', 'だいすき']
  ];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.phrases) {
    S = {
      seq: 1,
      cat: 'よく使う',
      phrases: PRESETS.map(function (p, i) { return { id: 'p' + i, cat: p[0], text: p[1] }; }),
      recents: [],
      settings: { rate: 1.0, pitch: 1.15, voiceURI: '' }
    };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

  // ---------- 読み上げ ----------
  var synth = window.speechSynthesis;
  var jaVoices = [];
  function loadVoices() {
    if (!synth) return;
    jaVoices = synth.getVoices().filter(function (v) { return v.lang && v.lang.indexOf('ja') === 0; });
    renderVoiceSelect();
  }
  if (synth) {
    loadVoices();
    if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = loadVoices;
  }
  function pickVoice() {
    if (!jaVoices.length) return null;
    var wanted = S.settings.voiceURI;
    var v = jaVoices.filter(function (x) { return x.voiceURI === wanted; })[0];
    return v || jaVoices[0];
  }
  var speakingBtn = null;
  function speak(text, btn) {
    if (!synth) { toast('この端末では読み上げ機能が使えません'); return; }
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = S.settings.rate;
    u.pitch = S.settings.pitch;
    var v = pickVoice();
    if (v) u.voice = v;
    if (speakingBtn) speakingBtn.classList.remove('speaking');
    speakingBtn = btn || null;
    if (speakingBtn) speakingBtn.classList.add('speaking');
    u.onend = u.onerror = function () {
      if (speakingBtn) { speakingBtn.classList.remove('speaking'); speakingBtn = null; }
    };
    synth.speak(u);
    pushRecent(text);
  }

  // ---------- 最近使った ----------
  function pushRecent(text) {
    S.recents = S.recents.filter(function (t) { return t !== text; });
    S.recents.unshift(text);
    S.recents = S.recents.slice(0, 12);
    save(); renderRecents();
  }
  function renderRecents() {
    $('recentRow').innerHTML = S.recents.map(function (t) {
      return '<button data-text="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
  }
  $('recentRow').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    speak(b.dataset.text, b);
  });

  // ---------- 入力して話す ----------
  $('btnSpeak').addEventListener('click', function () {
    var t = $('talkInput').value.trim();
    if (!t) { toast('話したい言葉を入力してください'); return; }
    speak(t, this);
    renderSaveLine();
  });
  $('btnShow').addEventListener('click', function () {
    var t = $('talkInput').value.trim();
    if (!t) { toast('見せたい言葉を入力してください'); return; }
    showBig(t);
  });
  $('talkInput').addEventListener('input', renderSaveLine);
  function renderSaveLine() {
    var t = $('talkInput').value.trim();
    $('saveLine').innerHTML = t
      ? '<button id="btnSaveWord">この言葉をボタンに登録する</button> <button id="btnClearWord">消す</button>'
      : '';
    var bs = $('btnSaveWord'), bc = $('btnClearWord');
    if (bs) bs.addEventListener('click', function () { openAdd(t); });
    if (bc) bc.addEventListener('click', function () { $('talkInput').value = ''; renderSaveLine(); });
  }

  // ---------- 大きく表示 ----------
  function showBig(text) {
    var el = $('bigText');
    el.textContent = text;
    el.classList.toggle('long', text.length > 12);
    $('bigShow').classList.add('show');
  }
  $('bigShow').addEventListener('click', function () { this.classList.remove('show'); });

  // ---------- カテゴリとフレーズ ----------
  var editing = false;
  function renderCats() {
    $('catRow').innerHTML = CATS.map(function (c) {
      return '<button data-cat="' + esc(c) + '"' + (c === S.cat ? ' class="on"' : '') + '>' + esc(c) + '</button>';
    }).join('');
  }
  $('catRow').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.cat = b.dataset.cat; save();
    renderCats(); renderGrid();
  });
  function renderGrid() {
    var list = S.phrases.filter(function (p) { return p.cat === S.cat; });
    var html = list.map(function (p) {
      return '<button class="phrase" data-id="' + p.id + '">' + esc(p.text) +
        '<span class="del" aria-hidden="true">×</span></button>';
    }).join('');
    html += '<button class="add-tile" id="addTile">＋ ことばを登録</button>';
    if (list.length === 0) html = '<div class="grid-empty">このグループにはまだ登録がありません</div>' + html;
    $('grid').innerHTML = html;
  }
  $('grid').addEventListener('click', function (e) {
    if (e.target.closest('#addTile')) { openAdd(''); return; }
    var b = e.target.closest('button.phrase'); if (!b) return;
    var p = S.phrases.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (!p) return;
    if (editing) {
      if (confirm('「' + p.text + '」を削除しますか？')) {
        S.phrases = S.phrases.filter(function (x) { return x.id !== p.id; });
        save(); renderGrid();
      }
      return;
    }
    speak(p.text, b);
  });
  $('btnEdit').addEventListener('click', function () {
    editing = !editing;
    this.classList.toggle('on', editing);
    this.textContent = editing ? '完了' : '編集';
    $('shell').classList.toggle('editing', editing);
  });

  // ---------- 追加シート ----------
  function openAdd(text) {
    $('addText').value = text || '';
    $('addCat').innerHTML = CATS.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === S.cat ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
    $('addOverlay').classList.add('show');
  }
  $('addCancel').addEventListener('click', function () { $('addOverlay').classList.remove('show'); });
  $('addOverlay').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  $('addSave').addEventListener('click', function () {
    var t = $('addText').value.trim();
    if (!t) { toast('ことばを入力してください'); return; }
    S.phrases.push({ id: 'u' + (++S.seq) + Math.floor(Math.random() * 1000), cat: $('addCat').value, text: t });
    S.cat = $('addCat').value;
    save();
    $('addOverlay').classList.remove('show');
    $('talkInput').value = ''; renderSaveLine();
    renderCats(); renderGrid();
    toast('「' + t + '」を登録しました');
  });

  // ---------- 設定 ----------
  function renderVoiceSelect() {
    var sel = $('voiceSelect');
    if (!jaVoices.length) {
      sel.innerHTML = '<option value="">標準の日本語の声</option>';
      return;
    }
    sel.innerHTML = jaVoices.map(function (v) {
      return '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === S.settings.voiceURI ? ' selected' : '') + '>' +
        esc(v.name) + '</option>';
    }).join('');
  }
  function renderRanges() {
    $('rateRange').value = S.settings.rate; $('rateVal').textContent = S.settings.rate.toFixed(2);
    $('pitchRange').value = S.settings.pitch; $('pitchVal').textContent = S.settings.pitch.toFixed(2);
    renderRatePresets();
  }
  function renderRatePresets() {
    var btns = $('ratePresets').querySelectorAll('button');
    btns.forEach(function (b) {
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.rate) - S.settings.rate) < 0.01);
    });
  }
  $('ratePresets').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.settings.rate = parseFloat(b.dataset.rate); save();
    renderRanges();
    speak('この速さで話します。', b);
  });
  $('btnSettings').addEventListener('click', function () {
    renderRanges(); renderVoiceSelect();
    $('setOverlay').classList.add('show');
  });
  $('setClose').addEventListener('click', function () { $('setOverlay').classList.remove('show'); });
  $('setOverlay').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  $('rateRange').addEventListener('input', function () {
    S.settings.rate = parseFloat(this.value); $('rateVal').textContent = S.settings.rate.toFixed(2); save();
    renderRatePresets();
  });
  $('pitchRange').addEventListener('input', function () {
    S.settings.pitch = parseFloat(this.value); $('pitchVal').textContent = S.settings.pitch.toFixed(2); save();
  });
  $('voiceSelect').addEventListener('change', function () { S.settings.voiceURI = this.value; save(); });
  $('setTest').addEventListener('click', function () { speak('こんにちは。この声で話します。', this); });

  // ---------- トースト ----------
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // ---------- 起動 ----------
  save();
  renderRecents();
  renderCats();
  renderGrid();
  renderSaveLine();
})();
</script>
